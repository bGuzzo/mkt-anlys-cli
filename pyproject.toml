[project]
name = "mkt-anlys-cli"
version = "0.1.0"
description = "A Python-based CLI toolset designed to perform market analysis and evaluate stock portfolio strategies."
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pytest-cov>=7.1.0",
    "pydantic>=2.13.4",
    "typer>=0.25.1",
    "yfinance>=1.3.0",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
markers = [
    "unit: micro-level component verifications with no external I/O or pipelines",
    "integration: macro-level state, physical data, model flow, and pipeline tests",
]

# Linting and validation
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors: Enforces non-visual PEP 8 style conventions and invalid syntax markers
    "W",    # pycodestyle warnings: Catches minor style deviations and spacing violations
    "F",    # Pyflakes: Identifies logic errors like unused imports, undefined variables, and duplicate keys
    "I",    # isort: Automates import sorting and clean grouping (stdlib, third-party, local)
    "N",    # pep8-naming: Enforces strict naming semantics (snake_case variables, PascalCase classes)
    "UP",   # pyupgrade: Upgrades legacy syntax idioms automatically to target Python version (3.14)
    "B",    # flake8-bugbear: Flags design flaws and reliability bugs (e.g., mutable default arguments)
    "A",    # flake8-builtins: Prevents shadowing built-in Python namespaces (e.g., naming a variable 'id')
    "C4",   # flake8-comprehensions: Optimizes collections by forcing native comprehensions over functional maps
    "FA",   # flake8-future-annotations: Standardizes postponed evaluation of annotations across modules
    "PT",   # flake8-pytest-style: Enforces uniform configuration and fixture patterns for the pytest suite
    "TID",  # flake8-tidy-imports: Controls import anti-patterns and bans explicit relative imports in production
    "TCH",  # flake8-type-checking: Moves purely static types into `if TYPE_CHECKING:` blocks to reduce runtime memory overhead
    "RUF",  # Ruff-specific rules: Internal optimization rules catching async bugs, string format issues, and redundancies
]
ignore = [
    "N999", # Invalid module name (due to repository name having hyphens)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]


# Type check
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
# Ensure mypy searches for dependencies inside the uv managed virtual environment
explicit_package_bases = true
namespace_packages = true

# Ignore libraries missing PEP 561 type marker files or stubs
[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "matplotlib.*",
    "pandas.*",
    "numpy.*",
    "scipy.*",
    "typer.*",
    "pyarrow.*"
]
ignore_missing_imports = true
